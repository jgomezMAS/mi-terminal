[package]
name = "mi-terminal"
version = "0.5.0"
description = "Cliente SSH con pestañas, SFTP y túneles"
authors = ["Pato Leigh"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mi_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ssh2 = "0.9"
keyring = { version = "3", features = ["linux-native"] }
base64 = "0.22"
dirs = "6"
rand = "0.8"
aes = "0.8"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
